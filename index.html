<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Keerthu ❤️</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 50% 10%,#64164e 0%,#210d2b 38%,#09040d 100%);
    color:white;
}

#app{
    width:100%;
    height:100svh;
    position:relative;
    overflow:hidden;
}

/* SLIDES */

.slide{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:22px;
    opacity:0;
    transform:translateX(50px) scale(.97);
    pointer-events:none;
    transition:
        opacity .5s ease,
        transform .5s ease;
}

.slide.active{
    opacity:1;
    transform:translateX(0) scale(1);
    pointer-events:auto;
}

.content{
    width:min(900px,100%);
    max-height:90svh;
    overflow-y:auto;
    text-align:center;
    padding:10px 5px 80px;
    scrollbar-width:none;
}

.content::-webkit-scrollbar{
    display:none;
}

/* TEXT */

.eyebrow{
    color:#ffafd0;
    letter-spacing:3px;
    text-transform:uppercase;
    font-size:.75rem;
    margin-bottom:15px;
}

h1{
    font-size:clamp(2.4rem,10vw,5rem);
    line-height:1.05;
    margin-bottom:18px;
    text-shadow:0 5px 30px #0008;
}

h2{
    font-size:clamp(1.9rem,7vw,3.5rem);
    line-height:1.1;
    margin-bottom:18px;
}

p{
    color:#f5e6f0;
    font-size:1.03rem;
}

.date{
    color:#ff9fc8;
    letter-spacing:4px;
    font-weight:bold;
    margin:15px 0 20px;
}

/* CARDS */

.card{
    background:#ffffff10;
    border:1px solid #ffffff1c;
    border-radius:28px;
    padding:25px;
    margin:20px auto;
    max-width:760px;
    box-shadow:0 20px 60px #0005;
    backdrop-filter:blur(12px);
}

/* BUTTONS */

.btnrow{
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:25px;
}

.btn{
    border:1px solid #ffffff25;
    background:#ffffff12;
    color:white;
    padding:13px 21px;
    border-radius:999px;
    cursor:pointer;
    transition:.25s;
    box-shadow:0 8px 25px #0003;
}

.btn:hover{
    transform:translateY(-3px);
}

.btn:active{
    transform:scale(.95);
}

.primary{
    background:linear-gradient(135deg,#ff4f9a,#a83df5);
    border:none;
}

/* PHOTO */

.photo{
    width:100%;
    max-width:390px;
    aspect-ratio:1/1;
    margin:18px auto;
    border-radius:25px;
    overflow:hidden;
    border:1px dashed #ff79b2;
    background:#24152d;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#ffafd0;
    font-weight:bold;
}

.photo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* PHOTO GRID */

.photo-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    max-width:720px;
    margin:20px auto;
}

.photo-grid .photo{
    margin:0;
    max-width:none;
}

/* LETTER */

.letter{
    text-align:left;
    background:#fff9;
    color:#32172c;
    padding:27px;
    border-radius:27px;
    max-width:760px;
    margin:auto;
}

.letter p{
    color:#43283d;
    margin-bottom:15px;
}

.letter strong{
    color:#a51e67;
}

/* EMOJIS */

.bigemoji{
    font-size:5rem;
    animation:float 2s ease-in-out
